packages: ["packages/core", "packages/react", "packages/vite-plugin", "examples/*", "website"]

minimumReleaseAge: 10080 # 7 日
minimumReleaseAgeExclude: []

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - "@pierre/theme"
  - "@vercel/*"
  - "chokidar"
  - "semver"
  - "undici-types"

strictDepBuilds: true
onlyBuiltDependencies: []
allowBuilds:
  esbuild: true

update:
  ignoreDeps:
    - "*" # パッケージの更新は ncu に任せます。

overrides:
  lodash-es@>=4.0.0 <=4.17.23: ^4.18.1
  path-to-regexp@>=4.0.0 <6.3.0: ^6.3.0
  undici@>=7.0.0 <7.28.0: ^7.28.0
  undici@>=7.0.0 <7.29.0: ^7.29.0
  undici@>=7.0.0 <7.29.1: ^7.29.1
  undici@>=7.23.0 <7.28.0: ^7.28.0
  undici@>=7.24.1 <7.29.1: ^7.29.1
